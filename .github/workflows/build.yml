name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build release binary
        run: swift build -c release
      - name: Package app bundle
        run: ./scripts/build-app.sh release
